<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b1140"/>
      <stop offset="0.55" stop-color="#0d1030"/>
      <stop offset="1" stop-color="#06121f"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.3" cy="0.25" r="0.7">
      <stop offset="0" stop-color="#8b5cff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#8b5cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.85" cy="0.9" r="0.6">
      <stop offset="0" stop-color="#22e5c5" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#22e5c5" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="a" x1="0" y1="1" x2="0.6" y2="0">
      <stop offset="0" stop-color="#7b4dff"/>
      <stop offset="1" stop-color="#c38bff"/>
    </linearGradient>
    <linearGradient id="e" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4fb8ff"/>
      <stop offset="1" stop-color="#3ff3c8"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <filter id="blur" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="12"/></filter>
  </defs>

  <rect x="16" y="16" width="480" height="480" rx="120" fill="url(#bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="120" fill="url(#glowA)"/>
  <rect x="16" y="16" width="480" height="480" rx="120" fill="url(#glowB)"/>
  <rect x="18" y="18" width="476" height="476" rx="118" fill="none" stroke="#ffffff" stroke-opacity="0.09" stroke-width="3"/>

  <g transform="translate(-14 4)">
    <!-- soft neon glow -->
    <g filter="url(#blur)" opacity="0.75">
      <path d="M96 380 L184 136 L272 380" fill="none" stroke="url(#a)" stroke-width="40" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M440 292 A64 64 0 1 0 421.3 337.3" fill="none" stroke="url(#e)" stroke-width="40" stroke-linecap="round"/>
    </g>
    <!-- A -->
    <path d="M96 380 L184 136 L272 380" fill="none" stroke="url(#a)" stroke-width="40" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- e -->
    <path d="M440 292 A64 64 0 1 0 421.3 337.3" fill="none" stroke="url(#e)" stroke-width="40" stroke-linecap="round"/>
    <!-- the shared crossbar: A's bar becomes e's bar, like a text cursor -->
    <path d="M134 292 L440 292" fill="none" stroke="#ffffff" stroke-width="30" stroke-linecap="round"/>
    <!-- spark -->
    <circle cx="184" cy="136" r="13" fill="#ffffff"/>
    <circle cx="452" cy="150" r="7" fill="#3ff3c8"/>
    <circle cx="420" cy="118" r="4" fill="#c38bff"/>
  </g>
</svg>
